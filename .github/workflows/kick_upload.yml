name: Kick/YouTube to YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو (يوتيوب، كيك، إلخ)'
        required: true
        type: string

jobs:
  upload_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 yt-dlp

      - name: Run Download and Upload Script
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          echo "جاري تحميل الفيديو من الرابط: $VIDEO_URL"
          # استخدام yt-dlp لتحميل الفيديو بأفضل جودة و حفظه باسم video.mp4
          yt-dlp -f "bv*+ba/b" -o "video.mp4" "$VIDEO_URL" || yt-dlp -o "video.mp4" "$VIDEO_URL"
          
          echo "تم التحميل بنجاح، جاري بدء الرفع..."
          python main.py --file video.mp4
