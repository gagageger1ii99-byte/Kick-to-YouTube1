name: Advanced Kick/YouTube Pipeline

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'رابط الفيديو المراد تحميله'
        required: true
        type: string
      title:
        description: 'عنوان الفيديو على يوتيوب'
        required: false
        default: 'Auto Uploaded Stream'
        type: string
      privacy:
        description: 'خصوصية الفيديو (private, unlisted, public)'
        required: false
        default: 'private'
        type: string

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 yt-dlp

      - name: Download Video via yt-dlp
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          echo "جاري تحميل الفيديو من الرابط المحدد..."
          yt-dlp -f "bv*+ba/b" -o "video.mp4" "$VIDEO_URL" || yt-dlp -o "video.mp4" "$VIDEO_URL"

      - name: Upload to YouTube
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python main.py --file video.mp4 --title "${{ github.event.inputs.title }}" --privacy "${{ github.event.inputs.privacy }}"

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f video.mp4
          echo "تم تنظيف الملفات المؤقتة بنجاح."
