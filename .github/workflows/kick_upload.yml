name: Advanced Multi-Platform Pipeline

on:
  repository_dispatch:
    types: [kick_upload_event]

jobs:
  process_video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Downloader Pipeline
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_URL: ${{ github.event.client_payload.url }}
          VIDEO_TITLE: ${{ github.event.client_payload.title }}
          VIDEO_PRIVACY: ${{ github.event.client_payload.privacy }}
        run: |
          echo "Processing URL: $VIDEO_URL"
          # هنا تضع المنطق الخاص بك لاكتشاف المنصة
          if [[ "$VIDEO_URL" == *"kick.com"* ]]; then
            echo "Detected Kick video. Starting Kick-to-YouTube logic..."
            # أضف أمر التحميل الخاص بك لـ Kick هنا
          elif [[ "$VIDEO_URL" == *"tiktok.com"* ]]; then
            echo "Detected TikTok video. Starting TikTok-to-YouTube logic..."
          elif [[ "$VIDEO_URL" == *"twitter.com"* ]] || [[ "$VIDEO_URL" == *"x.com"* ]]; then
            echo "Detected Twitter/X video..."
          elif [[ "$VIDEO_URL" == *"youtube.com"* ]] || [[ "$VIDEO_URL" == *"youtu.be"* ]]; then
            echo "Detected YouTube video..."
          else
            echo "Unknown platform, trying generic download..."
          fi
          # تشغيل سكريبت الرفع الخاص بك
